name: Deploy Vantis (Worker + D1 + app)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy
  cancel-in-progress: false
env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Installeren en testen
        run: |
          npm ci
          npm test
      - name: App bouwen (src/ -> site/)
        run: python build.py

      - name: D1-database klaarzetten (eenmalig aanmaken, EU)
        run: |
          npx wrangler d1 list --json > d1.json || echo '[]' > d1.json
          if ! python3 -c "import json,sys;sys.exit(0 if any(d.get('name')=='csa-db' for d in json.load(open('d1.json'))) else 1)"; then
            npx wrangler d1 create csa-db --jurisdiction eu
            npx wrangler d1 list --json > d1.json
          fi
          ID=$(python3 -c "import json;print(next((d.get('uuid') or d.get('id')) for d in json.load(open('d1.json')) if d.get('name')=='csa-db'))")
          sed -i "s/00000000-0000-0000-0000-000000000000/$ID/" wrangler.jsonc
          npx wrangler d1 migrations apply csa-db --remote

      - name: Versleutelsleutel overzetten van de oude worker (eenmalig, vóór publiceren)
        run: |
          set -e
          HAS_NEW=$(npx wrangler secret list --name vantis --format json 2>/dev/null | grep -c '"ENC_KEY"' || true)
          HAS_OLD=$(npx wrangler secret list --name csa --format json 2>/dev/null | grep -c '"ENC_KEY"' || true)
          echo "nieuw: $HAS_NEW, oud: $HAS_OLD"
          if [ "$HAS_NEW" = "0" ] && [ "$HAS_OLD" != "0" ]; then
            TOKEN=$(openssl rand -hex 24); echo "::add-mask::$TOKEN"
            printf '%s' "$TOKEN" | npx wrangler secret put MIGRATE_TOKEN --name csa
            python3 - <<'PY'
          import json,re
          t=open('wrangler.jsonc').read(); t=re.sub(r'(?m)^\s*//.*$','',t); c=json.loads(t)
          c['name']='csa'; c['triggers']={'crons':[]}; json.dump(c,open('wrangler.old.json','w'))
          PY
            npx wrangler deploy -c wrangler.old.json > /dev/null
            for i in 1 2 3 4 5 6; do
              K=$(curl -sS -H "x-migrate: $TOKEN" https://csa.rijnstadmarketing.workers.dev/api/_migrate-key | python3 -c "import sys,json;print(json.load(sys.stdin).get('k') or '')" 2>/dev/null || true)
              [ -n "$K" ] && break; sleep 5
            done
            if [ -z "$K" ]; then echo "Sleutel overzetten mislukt: stop, zodat bestaande accounts blijven werken"; exit 1; fi
            echo "::add-mask::$K"
            printf '%s' "$K" | npx wrangler secret put ENC_KEY --name vantis
            echo y | npx wrangler secret delete MIGRATE_TOKEN --name csa || true
            echo "Sleutel overgezet"
          fi

      - name: Oude worker-adres doorsturen naar Vantis (en zijn cron-triggers vrijgeven)
        run: |
          mkdir -p old-redirect
          printf 'export default { fetch(req) { const u = new URL(req.url); return Response.redirect("%s" + u.pathname + u.search, 301); } };\n' "https://vantis.rijnstadmarketing.workers.dev" > old-redirect/worker.js
          printf '{ "name": "csa", "main": "worker.js", "compatibility_date": "2026-11-01", "workers_dev": true, "triggers": { "crons": [] } }\n' > old-redirect/wrangler.json
          npx wrangler deploy -c old-redirect/wrangler.json || echo "Oude worker niet gevonden, overgeslagen"

      - name: Worker publiceren
        run: |
          set -o pipefail
          npx wrangler deploy 2>&1 | tee deploy.log
          URL=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "Worker: $URL"
          echo "WORKER_URL=$URL" >> "$GITHUB_ENV"

      - name: Geheimen instellen (alleen als ze zijn opgegeven)
        env:
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
          COINGECKO_KEY: ${{ secrets.COINGECKO_KEY }}
          CRYPTOCOMPARE_KEY: ${{ secrets.CRYPTOCOMPARE_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_PRICE_ID: ${{ secrets.STRIPE_PRICE_ID }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          PREMIUM_PRICE_LABEL: ${{ secrets.PREMIUM_PRICE_LABEL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          STRIPE_PRICE_ID_PRO: ${{ secrets.STRIPE_PRICE_ID_PRO }}
          STRIPE_PRICE_ID_YEAR: ${{ secrets.STRIPE_PRICE_ID_YEAR }}
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
        run: |
          EXIST=$(npx wrangler secret list --format json 2>/dev/null || echo '[]')
          # sleutel voor het versleutelen van 2FA-geheimen: eenmalig automatisch aanmaken, nooit overschrijven
          if ! echo "$EXIST" | grep -q '"ENC_KEY"'; then openssl rand -base64 48 | npx wrangler secret put ENC_KEY; fi
          for NAME in FINNHUB_KEY COINGECKO_KEY CRYPTOCOMPARE_KEY STRIPE_SECRET_KEY STRIPE_PRICE_ID STRIPE_WEBHOOK_SECRET PREMIUM_PRICE_LABEL TELEGRAM_BOT_TOKEN RESEND_API_KEY MAIL_FROM STRIPE_PRICE_ID_PRO STRIPE_PRICE_ID_YEAR ADMIN_EMAILS; do
            VAL="${!NAME}"
            if [ -n "$VAL" ]; then printf '%s' "$VAL" | npx wrangler secret put "$NAME"; fi
          done

      - name: Telegram-webhook instellen (alleen met bot-token)
        if: env.WORKER_URL != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then echo "Geen Telegram-token, overgeslagen"; exit 0; fi
          SECRET=$(printf 'vantis-tg:%s' "$TELEGRAM_BOT_TOKEN" | sha256sum | cut -c1-48)
          curl -sS "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/setWebhook" -d "url=${WORKER_URL}/api/telegram/webhook" -d "secret_token=${SECRET}" -d 'allowed_updates=["message"]' | head -c 300; echo
          curl -sS "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/setMyCommands" -H 'content-type: application/json' -d '{"commands":[{"command":"koers","description":"Actuele koers, bijv. /koers BTC"},{"command":"briefing","description":"Ochtendbriefing"},{"command":"portefeuille","description":"Je oefenportefeuille"},{"command":"stop","description":"Meldingen stoppen"}]}' | head -c 200; echo

      - name: Oude link (pages.dev) doorsturen naar de nieuwe app
        if: env.WORKER_URL != ''
        run: |
          mkdir -p pages-redirect
          printf '/* %s/:splat 302\n' "$WORKER_URL" > pages-redirect/_redirects
          printf '<!doctype html><meta http-equiv="refresh" content="0;url=%s"><a href="%s">Vantis</a>' "$WORKER_URL" "$WORKER_URL" > pages-redirect/index.html
          npx wrangler pages deploy pages-redirect --project-name=csa-app --branch=main
