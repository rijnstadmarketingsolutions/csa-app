name: Marktdata exporteren (voor schermafbeeldingen)
on: workflow_dispatch
env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --no-audit --no-fund || npm i --no-audit --no-fund
      - name: Database-ID invullen
        run: |
          npx wrangler d1 list --json > d1.json
          ID=$(python3 -c "import json;print(next((d.get('uuid') or d.get('id')) for d in json.load(open('d1.json')) if d.get('name')=='csa-db'))")
          sed -i "s/00000000-0000-0000-0000-000000000000/$ID/" wrangler.jsonc
      - name: Alleen openbare marktdata exporteren (geen gebruikers)
        run: |
          mkdir -p out
          for k in tickers names candles xquotes stocks fx extra news briefing ticks unlocks market scanstatus fcrank; do
            npx wrangler d1 execute csa-db --remote --json --command "SELECT key,val,ts FROM kv WHERE key='$k'" > out/kv_$k.json || true
          done
          npx wrangler d1 execute csa-db --remote --json --command "SELECT key,val,ts FROM kv WHERE key LIKE 'fc:%' OR key LIKE 'hist:%' OR key LIKE 'why:%'" > out/kv_misc.json || true
          npx wrangler d1 execute csa-db --remote --json --command "SELECT * FROM events WHERE first > (strftime('%s','now')-3*86400)*1000" > out/events.json || true
          ls -la out
      - name: Op tijdelijke branch zetten
        run: |
          cd out && git init -q -b marktdata && git add . && git -c user.name=vantis -c user.email=bot@vantis.local commit -qm marktdata
          git push -f -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" marktdata
