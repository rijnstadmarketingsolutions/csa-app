name: Verken databronnen
on:
  workflow_dispatch:
    inputs:
      urls:
        description: 'Spatiegescheiden lijst met URLs'
        required: true
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Ophalen
        env:
          URLS: ${{ github.event.inputs.urls }}
        run: |
          for u in $URLS; do
            echo "=================== $u"
            curl -sS -m 25 -A "Mozilla/5.0 CSA" -w "\n[HTTP %{http_code}, %{size_download} bytes]\n" "$u" -o /tmp/out.txt || true
            head -c 2500 /tmp/out.txt; echo; tail -c 200 /tmp/out.txt | head -c 0
            echo "[grootte: $(wc -c < /tmp/out.txt)]"
          done
