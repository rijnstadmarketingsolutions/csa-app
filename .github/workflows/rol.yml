name: Rol geven (beheer)
on:
  workflow_dispatch:
    inputs:
      wie:
        description: 'E-mailadres of gebruikersnaam'
        required: true
      rol:
        description: 'founder, senior_partner, admin, moderator, coach, analist, support of leeg'
        required: false
        default: 'founder'
env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
jobs:
  rol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --no-audit --no-fund || npm i --no-audit --no-fund
      - name: Database-ID invullen
        run: |
          npx wrangler d1 list --json > d1.json
          ID=$(python3 -c "import json;print(next((d.get('uuid') or d.get('id')) for d in json.load(open('d1.json')) if d.get('name')=='csa-db'))")
          sed -i "s/00000000-0000-0000-0000-000000000000/$ID/" wrangler.jsonc
      - name: Rol zetten
        env:
          WIE: ${{ inputs.wie }}
          ROL: ${{ inputs.rol }}
        run: |
          W=$(printf '%s' "$WIE" | tr 'A-Z' 'a-z' | sed "s/^@//; s/[^a-z0-9@._+-]//g")
          R=$(printf '%s' "$ROL" | sed 's/[^a-z_]//g')
          case "$R" in founder|senior_partner|admin|moderator|coach|analist|support|"") ;; *) echo "Onbekende rol"; exit 1;; esac
          if [ -z "$R" ]; then V="NULL"; else V="'$R'"; fi
          npx wrangler d1 execute csa-db --remote --command "UPDATE users SET role=$V WHERE lower(email)='$W' OR username='$W'"
          npx wrangler d1 execute csa-db --remote --command "SELECT name,username,role,plan FROM users WHERE lower(email)='$W' OR username='$W'"
